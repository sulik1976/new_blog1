{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Блог Дмитрия Сулейманова{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'article_list' %}" class="brand">
                <img src="{% static 'images/avatar.jpg' %}" alt="Дмитрий Сулейманов" class="brand-avatar">
                <div class="brand-text">
                    <span class="brand-name">Дмитрий Сулейманов</span>
                    <span class="brand-tagline"></span>
                </div>
            </a>
            <nav class="site-nav" aria-label="Основная навигация">
                <a href="{% url 'article_list' %}">Статьи</a>
                <a href="/admin/">Админка</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© {% now "Y" %} Дмитрий Сулейманов. Сделано на Django.</p>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
