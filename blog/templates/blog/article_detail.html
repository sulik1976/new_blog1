{% extends "blog/base.html" %}

{% block title %}{{ article.title }} — Мой блог{% endblock %}

{% block content %}
    <article class="article-detail">
        <h2>{{ article.title }}</h2>
        <p class="article-meta">🕒 {{ article.created_at|date:"d.m.Y в H:i" }}</p>

        {% if article.image %}
            <img src="{{ article.image.url }}" alt="{{ article.title }}" class="article-detail-image">
        {% endif %}

        <div class="article-content">
            {{ article.content|linebreaks }}
        </div>
        <a href="{% url 'article_list' %}" class="back-link">← Ко всем статьям</a>
    </article>
{% endblock %}
